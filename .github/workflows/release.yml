name: Release

# Publishes a version tag (vX.Y.Z): re-runs CI on the tagged commit, checks the
# tag matches the package version, builds with `reflex component build`,
# publishes to PyPI and creates the GitHub release with the files attached and
# the matching CHANGELOG.md section as notes.
#
# Triggers: pushing a `v*` tag, or running it manually with an existing tag
# (Actions -> Release -> Run workflow), e.g. for a tag pushed before this
# workflow existed.
#
# PyPI authentication: the `pypi` environment's PYPI_API_TOKEN secret is used
# when present; otherwise the publish action falls back to Trusted Publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v0.2.2)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-]?[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::'${TAG}' is not a version tag (vX.Y.Z)"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  ci:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: refs/tags/${{ needs.resolve.outputs.tag }}

  build:
    name: Build release distribution
    runs-on: ubuntu-latest
    needs: [resolve, ci]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      # No cache on the release path.
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --frozen --extra dev
      - name: Verify tag matches package version
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          version="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          module="$(uv run python -c 'import reflex_rosencharts as m; print(m.__version__)')"
          if [ "v${version}" != "${TAG}" ] || [ "${module}" != "${version}" ]; then
            echo "::error::Tag ${TAG}, pyproject ${version} and __version__ ${module} must match"
            exit 1
          fi
      - name: reflex component build
        # PYTHONPATH=. is required by the .pyi generation step.
        run: PYTHONPATH=. uv run reflex component build
      - name: Check metadata
        run: uv run twine check --strict dist/*
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          version="${TAG#v}"
          awk -v v="${version}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${version}"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/reflex-rosencharts/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [resolve, pypi]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "${TAG}" --notes-file release-notes.md --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" dist/* --repo "${GITHUB_REPOSITORY}" \
              --title "${TAG}" --notes-file release-notes.md --verify-tag
          fi
