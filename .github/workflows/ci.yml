name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
  # Called by release.yml before building and publishing a tag.
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out (defaults to the triggering commit)
        type: string
        default: ""

env:
  # Run every JavaScript action on the Node 24 runtime.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow_ref }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      # ruff comes from uv.lock (dev extra), so CI and local runs use the same version.
      - name: Install
        run: uv sync --frozen --extra dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check custom_components reflex_rosencharts_demo tests rxconfig.py

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen --extra dev --group test
      - name: pytest
        run: uv run pytest -q

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen --extra dev --group test
      - name: Generate .pyi stubs
        # Reflex 0.10 removed `reflex component build`. PYTHONPATH=. is required
        # by the .pyi generation step.
        run: PYTHONPATH=. uv run python -m reflex_base.utils.pyi_generator custom_components/reflex_rosencharts
      - name: Build sdist + wheel
        run: uv build
      - name: twine check
        run: uv run twine check --strict dist/*
      - name: Wheel ships every TSX file
        run: |
          expected=$(find custom_components/reflex_rosencharts -name '*.tsx' | wc -l)
          shipped=$(unzip -l dist/*.whl | grep -c '\.tsx$')
          echo "expected=${expected} shipped=${shipped}"
          test "${expected}" = "${shipped}"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  demo:
    name: Demo app (compile + axis checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install
        run: uv sync --frozen --extra dev --group test
      - name: Compile and build the demo frontend (prod)
        run: uv run reflex export --frontend-only --no-zip --env prod
      - name: Demo build produced an index page
        run: test -f .web/build/client/index.html
      - name: Install esbuild for the axis checks
        # Reflex 0.10 builds with Vite 8 / rolldown and no longer ships esbuild.
        run: npm install --no-save --no-audit --no-fund --prefix scripts esbuild@0.28.2
      - name: Scatter/line axis regression checks
        run: node scripts/check_scatter_axes.mjs
