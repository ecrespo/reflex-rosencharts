name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
  # Called by release.yml before building and publishing a tag.
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out (defaults to the triggering commit)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow_ref }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # ruff comes from uv.lock (dev extra), so CI and local runs use the same version.
      - name: Install
        run: uv sync --frozen --extra dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check custom_components reflex_rosencharts_demo tests rxconfig.py

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen --extra dev --group test
      - name: pytest
        run: uv run pytest -q

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen --extra dev --group test
      - name: reflex component build
        # PYTHONPATH=. is required by the .pyi generation step.
        run: PYTHONPATH=. uv run reflex component build
      - name: twine check
        run: uv run twine check --strict dist/*
      - name: Wheel ships every TSX file
        run: |
          expected=$(find custom_components/reflex_rosencharts -name '*.tsx' | wc -l)
          shipped=$(unzip -l dist/*.whl | grep -c '\.tsx$')
          echo "expected=${expected} shipped=${shipped}"
          test "${expected}" = "${shipped}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  demo:
    name: Demo app (compile + axis checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install
        run: uv sync --frozen --extra dev --group test
      - name: Compile and build the demo frontend (prod)
        run: uv run reflex export --frontend-only --no-zip --env prod
      - name: Demo build produced an index page
        run: test -f .web/build/client/index.html
      - name: Scatter/line axis regression checks
        run: node scripts/check_scatter_axes.mjs
