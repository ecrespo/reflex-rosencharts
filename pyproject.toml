[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-rosencharts"
version = "0.2.1"
description = "A Reflex custom component port of the rosencharts charting library (D3.js + Tailwind), usable from pure Python."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [{ name = "Ernesto Crespo", email = "ecrespo@gmail.com" }]
keywords = ["reflex", "reflex-custom-components", "charts", "dataviz", "d3", "tailwind", "rosencharts"]
dependencies = [
    "reflex>=0.9.5.post2",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://github.com/ecrespo/reflex-rosencharts"
Repository = "https://github.com/ecrespo/reflex-rosencharts"
Issues = "https://github.com/ecrespo/reflex-rosencharts/issues"

[project.optional-dependencies]
# Publishing toolchain (Reflex custom-component template convention).
dev = ["build", "twine"]

[dependency-groups]
# Local dev/test tooling (not published to PyPI; PEP 735).
test = ["pytest>=8", "pytest-cov", "playwright"]

[tool.setuptools.packages.find]
where = ["custom_components"]

[tool.setuptools.package-data]
"reflex_rosencharts" = ["**/*.tsx", "**/*.ts", "**/*.js", "**/*.jsx", "**/*.css"]
